<!doctype html>
<html lang="et">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Midnight Ramen</title>
  </head>

  <body class="bg-[#fff3f3]">
    <header class="bg-[#8d79c7] min-h-[72px]">
      <nav class="max-w-[1920px] min-h-[72px] mx-auto px-4 md:px-12 flex flex-col md:flex-row items-center justify-center md:justify-between gap-3 py-3 md:py-0">
        <div class="md:w-1/3 flex justify-center md:justify-start">
          <a href="/index.html">
            <img
              src="/images/logovaike.png"
              alt="Midnight Ramen"
              class="h-10 md:h-12"
            />
          </a>
        </div>

        <div class="md:w-1/3 flex justify-center gap-2 md:gap-3">
          <a
            href="/dishes.html"
            class="bg-[#fff3f3] border border-black/40 rounded-md px-3 md:px-4 py-1 text-xs md:text-sm"
          >
            🍜 dishes
          </a>

          <a
            href="/reservations.html"
            class="bg-[#fff3f3] border border-black/40 rounded-md px-3 md:px-4 py-1 text-xs md:text-sm"
          >
            🛒 reservations
          </a>
        </div>

        <div class="md:w-1/3 flex justify-center md:justify-end">
          <a
            href="/contact.html"
            class="bg-[#fff3f3] border border-black/40 rounded-md px-3 md:px-4 py-1 text-xs md:text-sm"
          >
            ✉ contact us
          </a>
        </div>
      </nav>
    </header>

    <main class="bg-[#fff3f3] min-h-[650px] px-6 md:px-8 py-16 md:py-24">
      <section class="max-w-[1250px] mx-auto">
        <form class="w-full max-w-[400px] mx-auto md:mx-0">
          <label class="sr-only" for="name">Nimi</label>
          <input
            id="name"
            type="text"
            placeholder="name:"
            class="w-full h-10 border border-black/40 bg-transparent px-3 mb-3 text-sm outline-none"
          />

          <label class="sr-only" for="email">Email</label>
          <input
            id="email"
            type="email"
            placeholder="Email:"
            class="w-full h-10 border border-black/40 bg-transparent px-3 mb-3 text-sm outline-none"
          />

          <label class="sr-only" for="tel">Telefon</label>
          <input
            id="tel"
            type="tel"
            placeholder="Tel:"
            class="w-full h-10 border border-black/40 bg-transparent px-3 mb-3 text-sm outline-none"
          />

          <label class="sr-only" for="message">Sõnum</label>
          <textarea
            id="message"
            placeholder="Text goes here"
            class="w-full h-[170px] border border-black/40 bg-transparent px-3 py-2 text-sm outline-none resize-none"
          ></textarea>

          <button
            type="submit"
            class="mt-3 bg-[#2c0d20] text-white px-7 py-2 text-xs"
          >
            Saada
          </button>
        </form>
      </section>
    </main>

    <footer id="contact" class="bg-[#8d79c7] text-white px-6 md:px-8 py-14 md:py-16">
      <div class="max-w-[1250px] mx-auto grid grid-cols-1 md:grid-cols-3 items-center gap-10 md:gap-16 text-center md:text-left">
        <div class="flex flex-col items-center md:items-start">
          <img
            src="/images/logo.png"
            alt="Midnight Ramen logo"
            class="h-24 md:h-28 mb-5"
          />
        </div>

        <div>
          <h3 class="text-[22px] md:text-[24px] font-bold mb-5">
            Contacts
          </h3>

          <p class="text-sm font-semibold mb-3">P: +372 52 14592</p>
          <p class="text-sm font-semibold mb-3">E: info@midnightramen.ee</p>
          <p class="text-sm font-semibold">Tallinn Jaama tn 10</p>
        </div>

        <div>
          <h3 class="text-[22px] md:text-[24px] font-bold mb-6">
            join our newsletter
          </h3>

          <form class="flex justify-center md:justify-start">
            <label for="newsletter-email" class="sr-only">Email</label>

            <input
              id="newsletter-email"
              type="email"
              placeholder="Email Address"
              class="h-10 w-[190px] sm:w-[240px] rounded-l-full bg-[#fff3f3] px-4 text-xs text-black outline-none"
            />

            <button
              type="submit"
              class="h-10 rounded-r-full bg-[#2c0d20] px-5 md:px-7 text-xs text-white"
            >
              submit
            </button>
          </form>
        </div>
      </div>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
